# 指定端口
server:
  port: 9777
jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    #    指定 Jasypt 加密过程中使用的 IV（Initialization Vector，初始化向量）生成策略
    # 3.0.0以后版本必须指定该值, 否则
    iv-generator-classname: org.jasypt.iv.NoIvGenerator # 3.0.0以后版本必须指定该值, 否则


